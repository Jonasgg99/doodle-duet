<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Doodle Duet</title>
  <meta name="description" content="Draw, guess, swap. A two-player drawing game you play at your own pace.">
  <meta name="theme-color" content="#eef0f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Figtree:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Self-heal after an update. GitHub Pages lets browsers keep each file for 10 minutes, so a
    // phone can get a new page with an old script (or the reverse) and crash on start. If the app
    // hasn't started (app.js sets __ddStarted) after a startup error or 10 s, re-download every
    // file, bypassing the cache, and reload. At most once a minute, so a bad connection can't loop.
    (function () {
      var FILES = ["./", "index.html", "app.js", "game.js", "store.js", "words.js", "firebase-config.js", "push.js", "push-config.js", "style.css"];
      var timer;
      function heal() {
        clearTimeout(timer);
        if (window.__ddStarted || heal.running) return;
        heal.running = true;
        var last = 0;
        try { last = +sessionStorage.getItem("dd_heal") || 0; } catch (e) {}
        if (Date.now() - last < 60000) {
          var s = document.getElementById("stuck");
          if (s) s.hidden = false;
          return;
        }
        try { sessionStorage.setItem("dd_heal", String(Date.now())); } catch (e) {}
        Promise.all(FILES.map(function (f) { return fetch(f, { cache: "reload" }).catch(function () {}); }))
          .then(function () { location.reload(); });
      }
      addEventListener("error", function () { timer = setTimeout(heal, 300); });
      addEventListener("unhandledrejection", function () { timer = setTimeout(heal, 300); });
      setTimeout(heal, 10000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="./" class="brand" id="brand">Doodle&nbsp;Duet</a>
    <span class="mode-tag" id="mode-tag" hidden>local test mode</span>
  </header>

  <main>
    <section id="view-loading" class="view">
      <p class="muted">Loading…</p>
      <div class="card stack" id="stuck" hidden>
        <p>This is taking too long. Check your internet connection, then try again.</p>
        <button class="btn primary" type="button" onclick="location.reload()">Reload</button>
      </div>
    </section>

    <section id="view-home" class="view" hidden>
      <div class="card">
        <label class="label" for="name-input">Your name</label>
        <input id="name-input" class="input" maxlength="20" autocomplete="nickname" placeholder="What should your partner call you?">
      </div>

      <div class="card stack">
        <h2>Set up your game</h2>
        <div class="field">
          <span class="label" id="lang-label">Words</span>
          <div class="seg" id="lang-seg" role="radiogroup" aria-labelledby="lang-label"></div>
        </div>
        <button id="new-game-btn" class="btn primary">Start</button>
        <p class="muted small">60 seconds per drawing. You draw first, then send your partner the link. They guess, then draw the next one.</p>
      </div>
    </section>

    <section id="view-join" class="view" hidden>
      <div class="card stack">
        <h2 id="join-title">You're invited</h2>
        <p class="muted" id="join-sub"></p>
        <label class="label" for="join-name">Your name</label>
        <input id="join-name" class="input" maxlength="20" autocomplete="nickname">
        <button id="join-btn" class="btn primary">Join game</button>
        <p class="error" id="join-error" hidden></p>
      </div>
    </section>

    <section id="view-error" class="view" hidden>
      <div class="card stack">
        <p id="error-text"></p>
      </div>
    </section>

    <section id="view-game" class="view" hidden>
      <div class="scoreboard" id="scoreboard"></div>
      <div id="panel" class="panel"></div>
      <div class="history-wrap" id="history-wrap" hidden>
        <h2 class="section-title">Earlier rounds</h2>
        <ul class="history" id="history"></ul>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
